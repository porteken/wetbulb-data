name: Daily Wetbulb Update

on:
  workflow_dispatch:
    inputs:
      target_year:
        description: "Year to refresh (blank = current UTC year)"
        default: ""
      skip_db_load:
        description: "Fetch and upload only; skip Postgres"
        type: boolean
        default: false
      rebuild_year:
        description: "Scan the full selected year instead of only new dates"
        type: boolean
        default: false
      clear_year:
        description: "Delete the selected S3 year before rebuilding"
        type: boolean
        default: false
  schedule:
    - cron: "27 20 * * *"

concurrency:
  group: daily-wetbulb-update
  cancel-in-progress: false

env:
  BUCKET_NAME: wetbulb-parquet-files
  CITY_SHARD_COUNT: "10"
  FETCH_CONCURRENCY: "8"
  ERA5_LAND_CONCURRENCY: "8"
  ERA5_LAND_RELIABLE_LAG_DAYS: "8"

jobs:
  resolve-target:
    if: github.ref_name == 'prd' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      target_year: ${{ steps.target.outputs.year }}
      shard_matrix: ${{ steps.target.outputs.shards }}
      start_date: ${{ steps.target.outputs.start_date }}
      end_date: ${{ steps.target.outputs.end_date }}
      has_updates: ${{ steps.target.outputs.has_updates }}
    steps:
      - name: Resolve target year and city shards
        id: target
        env:
          POSTGRES_DB_URI: ${{ secrets.POSTGRES_DB_URI }}
          REBUILD_YEAR: ${{ inputs.rebuild_year }}
          SHARD_COUNT: ${{ env.CITY_SHARD_COUNT }}
          TARGET_YEAR_INPUT: ${{ inputs.target_year }}
        run: |
          target_year="$TARGET_YEAR_INPUT"
          if [ -z "$target_year" ]; then
            target_year="$(date -u +%Y)"
          fi
          if ! [[ "$target_year" =~ ^[0-9]{4}$ ]] || ((target_year < 2025)); then
            echo "target_year must be 2025 or later" >&2
            exit 2
          fi
          echo "year=$target_year" >> "$GITHUB_OUTPUT"
          current_year="$(date -u +%Y)"
          if [ "$target_year" -eq "$current_year" ]; then
            end_date="$(date -u -d yesterday +%F)"
          else
            end_date="$target_year-12-31"
          fi
          max_date="$(psql "$POSTGRES_DB_URI" --tuples-only --no-align --command "SELECT max(date) FROM public.wetbulb WHERE date >= DATE '$target_year-01-01' AND date < DATE '$((target_year + 1))-01-01'")"
          if [ "$REBUILD_YEAR" = "true" ]; then
            start_date="$target_year-01-01"
          elif [ -n "$max_date" ]; then
            start_date="$(date -u -d "$max_date + 1 day" +%F)"
          else
            start_date="$target_year-01-01"
          fi
          echo "start_date=$start_date" >> "$GITHUB_OUTPUT"
          echo "end_date=$end_date" >> "$GITHUB_OUTPUT"
          if [[ "$start_date" > "$end_date" ]]; then
            echo "has_updates=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_updates=true" >> "$GITHUB_OUTPUT"
          fi
          python3 -c "import json,os; print('shards=' + json.dumps(list(range(int(os.environ['SHARD_COUNT'])))))" >> "$GITHUB_OUTPUT"

  prepare-current-year:
    needs: resolve-target
    runs-on: ubuntu-latest
    steps:
      - name: Clear selected year for a full rebuild
        if: inputs.clear_year
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_REGION }}
          TARGET_YEAR: ${{ needs.resolve-target.outputs.target_year }}
        run: |
          aws s3 rm \
            "s3://$BUCKET_NAME/na/na-msa-principal-cities-2023-ca-cma-ca-2021/wetbulb_data_csv/year=$TARGET_YEAR/" \
            --recursive
          aws s3 rm \
            "s3://$BUCKET_NAME/eu/wetbulb_data_csv/year=$TARGET_YEAR/" \
            --recursive

  fetch-current-year:
    if: needs.resolve-target.outputs.has_updates == 'true'
    needs: [resolve-target, prepare-current-year]
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        region:
          - name: na
            cities: cities_na.csv
            station_map: cities_na_ghcnh_stations.csv
            output_root: na/na-msa-principal-cities-2023-ca-cma-ca-2021
            cell_map: ""
          - name: eu
            cities: cities_eu.csv
            station_map: cities_eu_ghcnh_stations.csv
            output_root: eu
            cell_map: cities_eu_era5land_cells.csv
        shard: ${{ fromJson(needs.resolve-target.outputs.shard_matrix) }}
    runs-on: ubuntu-latest
    name: Refresh ${{ matrix.region.name }} ${{ needs.resolve-target.outputs.target_year }} shard ${{ matrix.shard }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version-file: "pyproject.toml"
      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990
        with:
          enable-cache: true
      - name: Sync runtime dependencies
        run: uv sync --locked --no-dev --no-build
      - name: Fetch NOAA GHCNh and replace the current-year shard
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_REGION }}
          TARGET_YEAR: ${{ needs.resolve-target.outputs.target_year }}
          START_DATE: ${{ needs.resolve-target.outputs.start_date }}
          END_DATE: ${{ needs.resolve-target.outputs.end_date }}
        run: |
          uv run --locked --no-build python ghcnh.py \
            --start-year "$TARGET_YEAR" \
            --end-year "$TARGET_YEAR" \
            --start-date "$START_DATE" \
            --end-date "$END_DATE" \
            --cities-csv "${{ matrix.region.cities }}" \
            --station-map-csv "${{ matrix.region.station_map }}" \
            --city-shard-index "${{ matrix.shard }}" \
            --city-shard-count "$CITY_SHARD_COUNT" \
            --concurrency "$FETCH_CONCURRENCY" \
            --force \
            --out-dir "s3://$BUCKET_NAME/${{ matrix.region.output_root }}"
      - name: Supplement Canadian gaps with official ECCC observations
        if: matrix.region.name == 'na'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_REGION }}
          TARGET_YEAR: ${{ needs.resolve-target.outputs.target_year }}
          START_DATE: ${{ needs.resolve-target.outputs.start_date }}
          END_DATE: ${{ needs.resolve-target.outputs.end_date }}
        run: |
          uv run --locked --no-build python eccc.py \
            --start-year "$TARGET_YEAR" \
            --end-year "$TARGET_YEAR" \
            --start-date "$START_DATE" \
            --end-date "$END_DATE" \
            --cities-csv cities_na.csv \
            --station-map-csv cities_na_eccc_stations.csv \
            --city-shard-index "${{ matrix.shard }}" \
            --city-shard-count "$CITY_SHARD_COUNT" \
            --concurrency "$FETCH_CONCURRENCY" \
            --force \
            --out-dir "s3://$BUCKET_NAME/${{ matrix.region.output_root }}"
      - name: Fill every GHCNh gap with DestinE ERA5-Land
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_REGION }}
          EDH_API_KEY: ${{ secrets.EDH_API_KEY }}
          TARGET_YEAR: ${{ needs.resolve-target.outputs.target_year }}
          START_DATE: ${{ needs.resolve-target.outputs.start_date }}
          END_DATE: ${{ needs.resolve-target.outputs.end_date }}
        run: |
          if [ "${{ matrix.region.name }}" != "na" ] || [ "${{ matrix.shard }}" != "0" ]; then
            sleep 300
          fi
          cell_map_args=()
          if [ -n "${{ matrix.region.cell_map }}" ]; then
            cell_map_args=(--cell-map-csv "${{ matrix.region.cell_map }}")
          fi
          uv run --locked --no-build python destine_era5land.py \
            --start-year "$TARGET_YEAR" \
            --end-year "$TARGET_YEAR" \
            --start-date "$START_DATE" \
            --end-date "$END_DATE" \
            --cities-csv "${{ matrix.region.cities }}" \
            --station-map-csv "${{ matrix.region.station_map }}" \
            --city-shard-index "${{ matrix.shard }}" \
            --city-shard-count "$CITY_SHARD_COUNT" \
            --concurrency "$ERA5_LAND_CONCURRENCY" \
            --min-missing-days 1 \
            --force \
            --out-dir "s3://$BUCKET_NAME/${{ matrix.region.output_root }}" \
            "${cell_map_args[@]}"

  load-current-year:
    if: needs.resolve-target.outputs.has_updates == 'true' && !inputs.skip_db_load
    needs: [resolve-target, fetch-current-year]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version-file: "pyproject.toml"
      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990
        with:
          enable-cache: true
      - name: Sync runtime dependencies
        run: uv sync --locked --no-dev --no-build
      - name: Download North America and Europe current-year shards
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_REGION }}
          TARGET_YEAR: ${{ needs.resolve-target.outputs.target_year }}
        run: |
          mkdir -p "na_data/year=$TARGET_YEAR" "eu_data/year=$TARGET_YEAR"
          aws s3 sync \
            "s3://$BUCKET_NAME/na/na-msa-principal-cities-2023-ca-cma-ca-2021/wetbulb_data_csv/year=$TARGET_YEAR/" \
            "na_data/year=$TARGET_YEAR/" \
            --delete
          aws s3 sync \
            "s3://$BUCKET_NAME/eu/wetbulb_data_csv/year=$TARGET_YEAR/" \
            "eu_data/year=$TARGET_YEAR/" \
            --delete
      - name: Audit, validate, and upsert both regions
        env:
          POSTGRES_DB_URI: ${{ secrets.POSTGRES_DB_URI }}
          TARGET_YEAR: ${{ needs.resolve-target.outputs.target_year }}
        run: |
          uv run --locked --no-build python audit_station_coverage.py \
            --root na=na_data \
            --root eu=eu_data \
            --cities-csv cities_na.csv \
            --cities-csv cities_eu.csv \
            --worst-cities 10
          uv run --locked --no-build python validate_daily_coverage.py \
            --cities-csv cities_na.csv \
            --wetbulb-root na_data \
            --year "$TARGET_YEAR" \
            --lag-days "$ERA5_LAND_RELIABLE_LAG_DAYS"
          uv run --locked --no-build python validate_daily_coverage.py \
            --cities-csv cities_eu.csv \
            --wetbulb-root eu_data \
            --year "$TARGET_YEAR" \
            --lag-days "$ERA5_LAND_RELIABLE_LAG_DAYS"
          uv run --locked --no-build python load_wetbulb.py \
            --wetbulb-root na_data \
            --load-workers 4
          uv run --locked --no-build python load_wetbulb.py \
            --wetbulb-root eu_data \
            --load-workers 4
      - name: Refresh materialized views
        env:
          POSTGRES_DB_URI: ${{ secrets.POSTGRES_DB_URI }}
        run: |
          for attempt in 1 2 3; do
            if uv run --locked --no-build python refresh_views.py; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "Materialized view refresh failed after $attempt attempts." >&2
              exit 1
            fi
            echo "Materialized view refresh failed; retrying in 60 seconds (attempt $((attempt + 1))/3)..." >&2
            sleep 60
          done

  notify-on-failure:
    if: github.ref_name == 'prd' && failure()
    needs: [resolve-target, fetch-current-year, load-current-year]
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Open or update the daily-update failure issue
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd
        with:
          script: |
            const title = "Daily wetbulb update failed";
            const body = [
              `The North America/Europe update failed on ${new Date().toISOString().slice(0, 10)}.`,
              ``,
              `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              ``,
              `The fetch and database load are idempotent; re-run the workflow after fixing the cause.`,
            ].join("\n");
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              labels: "daily-wetbulb-update-failure",
            });
            if (issues.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issues[0].number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ["daily-wetbulb-update-failure"],
              });
            }
