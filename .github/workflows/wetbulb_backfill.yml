name: Wetbulb Backfill (NOAA GHCNh)


on:
  workflow_dispatch:
    inputs:
      start_year:
        description: "First year to backfill"
        default: "1990"
      end_year:
        description: "Last year to backfill (blank = last complete year)"
        default: ""
      city_shard_count:
        description: "Parallel city-sharded fetch jobs"
        default: "5"
      concurrency:
        description: "Concurrent city fetches within one shard job"
        default: "8"
      clear_prefix:
        description: "Explicitly clear the North America catalog prefix before fetching"
        type: boolean
        default: false
      skip_db_load:
        description: "Fetch only; skip the Postgres load/truncate step"
        type: boolean
        default: false

concurrency:
  group: wetbulb-backfill
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      end_year: ${{ steps.resolve.outputs.end_year }}
      year_matrix: ${{ steps.resolve.outputs.year_matrix }}
      shard_matrix: ${{ steps.resolve.outputs.shard_matrix }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version-file: "pyproject.toml"
      - name: Resolve end year and shard matrix
        id: resolve
        env:
          START_YEAR: ${{ inputs.start_year }}
          END_YEAR_INPUT: ${{ inputs.end_year }}
          SHARD_COUNT: ${{ inputs.city_shard_count }}
        run: |
          END_YEAR="$END_YEAR_INPUT"
          if [ -z "$END_YEAR" ]; then
            END_YEAR=$(python3 -c "import nldas; print(nldas.NLDAS_END_YEAR)")
          fi
          if ! [[ "$START_YEAR" =~ ^[0-9]{4}$ ]] || ! [[ "$END_YEAR" =~ ^[0-9]{4}$ ]]; then
            echo "start_year and end_year must be four-digit years" >&2
            exit 2
          fi
          if ((START_YEAR > END_YEAR)); then
            echo "start_year must not be later than end_year" >&2
            exit 2
          fi
          {
            echo "end_year=$END_YEAR"
            python3 -c "import json,os; print('year_matrix=' + json.dumps(list(range(int(os.environ['START_YEAR']), int(os.environ['END_YEAR_INPUT'] or '$END_YEAR') + 1))))"
            python3 -c "import json,os; print('shard_matrix=' + json.dumps(list(range(int(os.environ['SHARD_COUNT'])))))"
          } >> "$GITHUB_OUTPUT"

  clear-wetbulb-output:
    if: ${{ inputs.clear_prefix }}
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version-file: "pyproject.toml"
      - name: Clear Wetbulb Prefix
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_REGION }}
        run: python3 clear_s3_prefix.py --bucket wetbulb-parquet-files --prefix na/na-msa-principal-cities-2023-ca-cma-ca-2021/wetbulb_data_csv/ --max-workers 8

  fetch:
    needs: [prepare, clear-wetbulb-output]
    if: |
      always() &&
      needs.prepare.result == 'success' &&
      (needs.clear-wetbulb-output.result == 'success' || needs.clear-wetbulb-output.result == 'skipped')
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        year: ${{ fromJson(needs.prepare.outputs.year_matrix) }}
        shard: ${{ fromJson(needs.prepare.outputs.shard_matrix) }}
    runs-on: ubuntu-latest
    name: Fetch ${{ matrix.year }} city shard ${{ matrix.shard }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version-file: "pyproject.toml"
      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990
        with:
          enable-cache: true
      - name: Sync runtime dependencies
        run: uv sync --locked --no-dev --no-build
      - name: Fetch NOAA GHCNh wet-bulb (writes straight to S3)
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_REGION }}
          SHARD_COUNT: ${{ inputs.city_shard_count }}
          CONCURRENCY: ${{ inputs.concurrency }}
        run: |
          uv run --locked --no-build python ghcnh.py \
            --start-year "${{ matrix.year }}" \
            --end-year "${{ matrix.year }}" \
            --cities-csv cities_na.csv \
            --station-map-csv cities_na_ghcnh_stations.csv \
            --city-shard-index ${{ matrix.shard }} \
            --city-shard-count "$SHARD_COUNT" \
            --concurrency "$CONCURRENCY" \
            --out-dir s3://wetbulb-parquet-files/na/na-msa-principal-cities-2023-ca-cma-ca-2021

  load-to-db:
    if: ${{ !inputs.skip_db_load }}
    needs: [prepare, fetch]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version-file: "pyproject.toml"
      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990
        with:
          enable-cache: true
      - name: Sync runtime dependencies
        run: uv sync --locked --no-dev --no-build
      - name: Generate North America city-center coordinates
        run: uv run --locked --no-build python make_city_center_map_na.py
      - name: Generate locations.csv from committed catalog
        run: uv run --locked --no-build python locations.py
      - name: Sync wetbulb data from S3
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_REGION }}
        run: |
          mkdir -p wetbulb_data_csv
          aws s3 sync s3://wetbulb-parquet-files/na/na-msa-principal-cities-2023-ca-cma-ca-2021/wetbulb_data_csv/ ./wetbulb_data_csv/ --delete
      - name: Load wetbulb into Postgres (full rebuild)
        env:
          POSTGRES_DB_URI: ${{ secrets.POSTGRES_DB_URI }}
        run: uv run --locked --no-build python load.py --truncate-table wetbulb --ensure-schema

  notify-on-failure:
    if: failure()
    needs: [prepare, clear-wetbulb-output, fetch, load-to-db]
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Open or update failure issue
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd
        with:
          script: |
            const title = `Wetbulb backfill failed: ${new Date().toISOString().slice(0, 10)}`;
            const body = [
              `The GHCNh wetbulb backfill workflow failed.`,
              ``,
              `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              ``,
              `ghcnh.py resumes via existing S3 output, so re-running the workflow only refetches missing year/shards.`,
            ].join("\n");
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              labels: "wetbulb-backfill-failure",
            });
            if (issues.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issues[0].number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ["wetbulb-backfill-failure"],
              });
            }
