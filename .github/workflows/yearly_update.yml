name: Yearly Update

on:
  workflow_dispatch:
  schedule:
    # Early April: ARCO-ERA5 final (non-preliminary) data for the previous
    # year is consolidated by then (see SAFE_STABLE_DATA_MONTH). The
    # build-target-window job also verifies availability before anything runs.
    - cron: "0 5 5 4 *"

concurrency:
  group: yearly-update
  cancel-in-progress: false

env:
  GCP_PROJECT_ID: weather-ai-478502
  CLOUD_RUN_JOB_NAME: era5-worker
  NLDAS_CLOUD_RUN_JOB_NAME: nldas-worker
  CLOUD_RUN_REGION: us-east1
  ERA5_BATCH_HOURS: "720"
  ERA5_TIME_SHARD_COUNT: "13"
  NLDAS_BATCH_HOURS: "720"
  NLDAS_TIME_SHARD_COUNT: "13"

jobs:
  build-target-window:
    if: github.ref_name == 'prd'
    runs-on: ubuntu-latest
    outputs:
      target_year: ${{ steps.compute.outputs.target_year }}
      window_start: ${{ steps.compute.outputs.window_start }}
      window_end: ${{ steps.compute.outputs.window_end }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version-file: "pyproject.toml"
      - name: Compute window and verify ARCO coverage
        id: compute
        run: python build_year_range.py --github --yearly --check-arco >> "$GITHUB_OUTPUT"

  deploy-infrastructure:
    if: github.ref_name == 'prd'
    needs: build-target-window
    runs-on: ubuntu-latest
    env:
      STACK_NAME: pet-data-infrastructure
      BUCKET_NAME: pet-parquet-files
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - name: Deploy S3 Bucket
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_REGION }}
        run: |
          aws cloudformation deploy --template-file template.yml --stack-name "$STACK_NAME" --parameter-overrides BucketName="$BUCKET_NAME" --no-fail-on-empty-changes

  cancel-running-cloud-run-executions:
    if: github.ref_name == 'prd'
    needs: deploy-infrastructure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version-file: "pyproject.toml"
      - name: Authenticate GCP
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db
      - name: Cancel running Cloud Run executions
        run: |
          python3 cancel_cloud_run_job_executions.py \
            --job "${{ env.CLOUD_RUN_JOB_NAME }}" \
            --region "${{ env.CLOUD_RUN_REGION }}" \
            --project "${{ env.GCP_PROJECT_ID }}"
          python3 cancel_cloud_run_job_executions.py \
            --job "${{ env.NLDAS_CLOUD_RUN_JOB_NAME }}" \
            --region "${{ env.CLOUD_RUN_REGION }}" \
            --project "${{ env.GCP_PROJECT_ID }}"

  clear-pet-output:
    if: github.ref_name == 'prd'
    needs: [build-target-window, deploy-infrastructure, cancel-running-cloud-run-executions]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version-file: "pyproject.toml"
      - name: Clear PET Prefix
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_REGION }}
        run: python3 clear_s3_prefix.py --bucket pet-parquet-files --prefix pet_data_csv/year=${{ needs.build-target-window.outputs.target_year }}/ --max-workers 8
      - name: Clear Wetbulb Prefix
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_REGION }}
        run: python3 clear_s3_prefix.py --bucket pet-parquet-files --prefix wetbulb_data_csv/year=${{ needs.build-target-window.outputs.target_year }}/ --max-workers 8

  provision-cloud-run:
    if: github.ref_name == 'prd'
    needs: [deploy-infrastructure, cancel-running-cloud-run-executions]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - name: Authenticate GCP
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db
      - name: Build and deploy Cloud Run workers
        env:
          GCP_PROJECT_ID: ${{ env.GCP_PROJECT_ID }}
          CLOUD_RUN_JOB_NAME: ${{ env.CLOUD_RUN_JOB_NAME }}
          NLDAS_CLOUD_RUN_JOB_NAME: ${{ env.NLDAS_CLOUD_RUN_JOB_NAME }}
          CLOUD_RUN_REGION: ${{ env.CLOUD_RUN_REGION }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_REGION }}
          EARTHDATA_USERNAME: ${{ secrets.EARTHDATA_USERNAME }}
          EARTHDATA_PASSWORD: ${{ secrets.EARTHDATA_PASSWORD }}
        run: /bin/bash ./cloudrun_provision.sh

  compute-pet-google-era5:
    if: github.ref_name == 'prd' && needs.build-target-window.outputs.target_year != ''
    needs: [build-target-window, clear-pet-output, provision-cloud-run]
    runs-on: ubuntu-latest
    name: ERA5->PET ${{ needs.build-target-window.outputs.target_year }} via Cloud Run tasks
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - name: Authenticate GCP
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db
      # One execution fans out over time shards via Cloud Run task indexing:
      # each task derives --time-shard-index from CLOUD_RUN_TASK_INDEX, and
      # per-task retries are handled by the job's --max-retries setting.
      - name: Pull ERA5 & Compute PET (writes straight to S3)
        run: |
          gcloud run jobs execute "${{ env.CLOUD_RUN_JOB_NAME }}" \
            --project "${{ env.GCP_PROJECT_ID }}" \
            --region "${{ env.CLOUD_RUN_REGION }}" --wait \
            --tasks "${{ env.ERA5_TIME_SHARD_COUNT }}" \
            --args="--year=${{ needs.build-target-window.outputs.target_year }},--city-shard-count=1,--time-shard-count=${{ env.ERA5_TIME_SHARD_COUNT }},--max-workers=1,--batch-hours=${{ env.ERA5_BATCH_HOURS }},--concurrency-profile=aggressive,--products=pet,--out-dir=s3://pet-parquet-files"

  compute-wetbulb-nldas:
    if: github.ref_name == 'prd' && needs.build-target-window.outputs.target_year != ''
    needs: [build-target-window, clear-pet-output, provision-cloud-run]
    runs-on: ubuntu-latest
    name: NLDAS->wetbulb ${{ needs.build-target-window.outputs.target_year }} via Cloud Run tasks
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - name: Authenticate GCP
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db
      # Same task-index fan-out pattern as the ERA5 job, but against NLDAS-2's
      # GES DISC HTTPS endpoint instead of the ARCO GCS zarr store.
      - name: Pull NLDAS-2 & Compute wet-bulb (writes straight to S3)
        run: |
          gcloud run jobs execute "${{ env.NLDAS_CLOUD_RUN_JOB_NAME }}" \
            --project "${{ env.GCP_PROJECT_ID }}" \
            --region "${{ env.CLOUD_RUN_REGION }}" --wait \
            --tasks "${{ env.NLDAS_TIME_SHARD_COUNT }}" \
            --args="--year=${{ needs.build-target-window.outputs.target_year }},--city-shard-count=1,--time-shard-count=${{ env.NLDAS_TIME_SHARD_COUNT }},--batch-hours=${{ env.NLDAS_BATCH_HOURS }},--out-dir=s3://pet-parquet-files"

  load-to-db:
    if: github.ref_name == 'prd'
    needs: [build-target-window, compute-pet-google-era5, compute-wetbulb-nldas]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version-file: "pyproject.toml"
      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990
        with:
          enable-cache: true
      - name: Sync runtime dependencies
        run: uv sync --locked --no-dev # NOSONAR
      - name: Sync year data from S3
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_REGION }}
          TARGET_YEAR: ${{ needs.build-target-window.outputs.target_year }}
        run: |
          for product in pet_data_csv wetbulb_data_csv; do
            prefix="${product}/year=${TARGET_YEAR}/"
            echo "Syncing s3://pet-parquet-files/${prefix}"
            mkdir -p "${product}"
            aws s3 sync "s3://pet-parquet-files/${prefix}" "./${prefix}"
          done
      # Upsert loads are idempotent (ON CONFLICT on (location_id, date)), so a
      # failed or re-run job can never duplicate rows and no delete-window
      # step is needed. Views stay in place and are refreshed afterwards.
      - name: Load year into Postgres
        env:
          POSTGRES_DB_URI: ${{ secrets.POSTGRES_DB_URI }}
        run: uv run --locked --no-build python load.py --append-only --skip-drop-views --skip-create-views --ensure-schema --skip-table locations --load-workers 4

  finalize-db-load:
    if: github.ref_name == 'prd'
    needs: load-to-db
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version-file: "pyproject.toml"
      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990
        with:
          enable-cache: true
      - name: Sync runtime dependencies
        run: uv sync --locked --no-dev # NOSONAR
      - name: Refresh materialized views
        env:
          POSTGRES_DB_URI: ${{ secrets.POSTGRES_DB_URI }}
        run: uv run --locked --no-build python refresh_views.py

  notify-on-failure:
    if: github.ref_name == 'prd' && failure()
    needs:
      [
        build-target-window,
        deploy-infrastructure,
        cancel-running-cloud-run-executions,
        clear-pet-output,
        provision-cloud-run,
        compute-pet-google-era5,
        compute-wetbulb-nldas,
        load-to-db,
        finalize-db-load,
      ]
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Open or update failure issue
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd
        with:
          script: |
            const title = `Yearly update failed: ${new Date().toISOString().slice(0, 10)}`;
            const body = [
              `The scheduled yearly pipeline failed.`,
              ``,
              `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              ``,
              `Loads are idempotent: re-run the failed jobs (or the whole workflow) once the cause is fixed.`,
            ].join("\n");
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              labels: "yearly-update-failure",
            });
            if (issues.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issues[0].number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ["yearly-update-failure"],
              });
            }
