sonar.projectKey=porteken_wetbulb-data
sonar.organization=porteken
sonar.qualitygate.wait=true

sonar.sources=.
sonar.tests=tests
sonar.test.inclusions=tests/**

sonar.exclusions=\
  .venv/**,\
  venv/**,\
  .conda/**,\
  __pycache__/**,\
  .ruff_cache/**,\
  .pytest_cache/**,\
  typings/**,\
  test_out/**,\
  tmp_*/**,\
  output_tiles/**,\
  pet_data_csv/**,\
  wetbulb_data_csv/**,\
  analytics_data_csv/**,\
  weather_data_parquet_test/**,\
  *.csv,\
  *.parquet,\
  *.log,\
  uv.lock

sonar.python.version=3.10
sonar.python.coverage.reportPaths=coverage.xml

sonar.coverage.exclusions=tests/**
sonar.cpd.exclusions=tests/**

sonar.plsql.file.suffixes=plsql