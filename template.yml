AWSTemplateFormatVersion: "2010-09-09"
Description: Infrastructure for PET Data Pipeline (S3 Bucket)

Parameters:
  BucketName:
    Type: String
    Default: pet-parquet-files
    Description: Name of the S3 bucket (Must be globally unique)

Resources:
  PetParquetFilesAccessLogsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "${BucketName}-access-logs"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      VersioningConfiguration:
        Status: Enabled

  PetParquetFilesAccessLogsBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref PetParquetFilesAccessLogsBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowS3ServerAccessLogsDelivery
            Effect: Allow
            Principal:
              Service: logging.s3.amazonaws.com
            Action: s3:PutObject
            Resource: !Sub "${PetParquetFilesAccessLogsBucket.Arn}/s3-access-logs/*"
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
              ArnLike:
                aws:SourceArn: !Sub "arn:${AWS::Partition}:s3:::${BucketName}"
          - Sid: AllowSSLRequestsOnly
            Effect: Deny
            Principal: "*"
            Action: "s3:*"
            Resource:
              - !GetAtt PetParquetFilesAccessLogsBucket.Arn
              - !Sub "${PetParquetFilesAccessLogsBucket.Arn}/*"
            Condition:
              Bool:
                aws:SecureTransport: "false"

  PetParquetFilesBucket: # NOSONAR
    Type: AWS::S3::Bucket # NOSONAR
    DependsOn: PetParquetFilesAccessLogsBucketPolicy
    Properties:
      BucketName: !Ref BucketName
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      VersioningConfiguration:
        Status: Enabled
      LoggingConfiguration:
        DestinationBucketName: !Ref PetParquetFilesAccessLogsBucket
        LogFilePrefix: s3-access-logs/

  PetParquetFilesBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref PetParquetFilesBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowSSLRequestsOnly
            Effect: Deny
            Principal: "*"
            Action: "s3:*"
            Resource:
              - !GetAtt PetParquetFilesBucket.Arn
              - !Sub "${PetParquetFilesBucket.Arn}/*"
            Condition:
              Bool:
                aws:SecureTransport: "false"

Outputs:
  BucketName:
    Value: !Ref PetParquetFilesBucket
    Description: The name of the S3 Bucket
  AccessLogsBucketName:
    Value: !Ref PetParquetFilesAccessLogsBucket
    Description: The name of the S3 bucket receiving server access logs
