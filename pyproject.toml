[project]
name = "wetbulb-data"
version = "0.1.0"
description = "Wet-bulb temperature data pipeline for NLDAS-2 ingestion, analytics, and Postgres loading."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
  "dask",
  "earthengine-api",
  "gcsfs",
  "h5netcdf",
  "h5py",
  "numpy>=2.3.2",
  "pandas",
  "pyarrow",
  "psycopg[binary]",
  "python-dotenv",
  "prophet",
  "requests",
  "thermofeel",
  "tqdm",
  "defusedxml>=0.7.1",
  "xarray",
  "zarr",
]

[dependency-groups]
dev = [
    "pyrefly>=1.1.1",
    "pytest",
    "pytest-cov>=7.1.0",
    "ruff",
]

[tool.uv]
package = false
default-groups = ["dev"]

[tool.pyrefly]
preset = "default"
project-includes = ["*.py", "tests/**/*.py"]
project-excludes = [
  "venv",
  ".venv",
  "typings",
  "**/__pycache__",
  ".ruff_cache",
  "output_tiles",
  "raw_weather_grib",
  "weather_data_parquet",
  "utci_data_parquet",
  "combined_data_parquet",
  "**/node_modules",
  "**/.*",
  ".conda",
]
python-version = "3.14"
python-platform = "linux"
python-interpreter-path = ".venv/bin/python"
search-path = [".", "typings"]
ignore-missing-imports = ["*"]

[tool.ruff]
line-length = 88
force-exclude = true
exclude = ["pyproject.toml", "typings", "venv", ".venv", ".conda", "archive"]

[tool.ruff.lint]
select = ["ALL"]
ignore = ["D203", "D213", "E501", "COM812"]

[tool.ruff.lint.mccabe]
max-complexity = 40

[tool.ruff.lint.pylint]
max-args = 12
max-branches = 40
max-statements = 300

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
  "S101",
  "D100",
  "D101",
  "D102",
  "D103",
  "D104",
  "D401",
  "PLR2004",
  "PD011",
  "RUF003",
  "PT001",
  "TC003",
  "PERF401",
  "PLC0415",
  "SLF001",
  "PYI034",
  "S608",
  "ANN401",
  "S105",
  "S107",
  "EM101",
  "ARG001",
]
"clear_s3_prefix.py" = ["S603"]
"cancel_cloud_run_job_executions.py" = ["S603"]
"pipeline.py" = ["S603"]
